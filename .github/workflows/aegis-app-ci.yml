name: AEGIS app CI

on:
  push:
    branches:
      - aegis-development
    paths:
      - "aegis-app/**"
      - ".github/workflows/aegis-app-ci.yml"
  pull_request:
    paths:
      - "aegis-app/**"
      - ".github/workflows/aegis-app-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Export generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: aegis-app-lockfile
          path: aegis-app/package-lock.json
          retention-days: 1
      - name: Verify clean lockfile installation
        run: npm ci
      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e "
            const report = require('./npm-audit.json');
            const vulnerabilities = Object.values(report.vulnerabilities || {});
            console.log('Dependency vulnerability summary:', JSON.stringify(report.metadata?.vulnerabilities || {}));
            for (const item of vulnerabilities) {
              console.log(JSON.stringify({
                name: item.name,
                severity: item.severity,
                isDirect: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable
              }));
            }
          "
      - name: Run unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build
