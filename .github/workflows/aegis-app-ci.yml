name: AEGIS app CI

on:
  push:
    branches:
      - aegis-development
    paths:
      - "aegis-app/**"
      - "supabase/**"
      - ".github/workflows/aegis-app-ci.yml"
  pull_request:
    paths:
      - "aegis-app/**"
      - "supabase/**"
      - ".github/workflows/aegis-app-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Export generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: aegis-app-lockfile
          path: aegis-app/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Verify clean lockfile installation
        run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=low
      - name: Run unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build
